<!DOCTYPE html>
<html>
    <head>
        <title>Tutorial</title>

        <style>
            .alert{
                color: aqua;
                background: green;
                padding: 5px;
            }
            .tip{
                color: purple;
            }
        </style>
    </head>

    <body>
        <h1 id="heading">Welcome</h1>
        <p class="intro">Hello</p>

        <script>
            // Step-1:Create a DIV and add it to the end of the body
            let div = document.createElement('div');
            div.className="alert";
            div.innerHTML=<p>"Congrats! You have created a div."</p>;
            document.body.append(div);

            //Step 2:Find the heading by idand change it
            let heading = document.getElementById("heading");
            heading.innerHTML = '&#128512;';

            //Step 3: Find the first element matching the CSS selector and change it
            document.querySelector('.intro').innerHTML = "<strong>Good Job!</strong>";

            //Step 4: Create an H2 with the class "tip" and add it to the start of the body
            let tip = document.createElement('h2');
            tip.className = 'tip';
            tip.innerHTML = "tip of the day";
            document.body.prepend('tip');
        </script>
    </body>
</html>
